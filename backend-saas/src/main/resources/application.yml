spring:
  application:
    name: smart-wealth
  datasource:
    url: jdbc:postgresql://localhost:5433/fintech_db
    username: postgres
    password: secret123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
